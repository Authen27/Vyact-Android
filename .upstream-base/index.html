    <!-- Analytics: Google tag (GA4). Since v10.125.0 (T4b, audit XC-PRV-03; owner, 19 Oct 2026) it is ASKED FOR
         first on the web (a banner; Settings and the Cookie Policy change the choice) and on in the Android
         app (its own permissions). Only on vyact.app, never before consent, loaded after paint + idle, with
         a redacted page_location. The build puts the script from api/_consent.js here (vite.config.ts,
         `vyact-analytics`), the same one the public Learn pages carry. -->
    <!--vyact:analytics-->

    <!-- Fonts (v10.52.0): fetched without blocking the first paint. The stylesheet used to be
         render-blocking (~780 ms on a throttled phone). Text now paints at once in the system
         fallback and swaps when the fonts arrive (they already used display=swap). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>
