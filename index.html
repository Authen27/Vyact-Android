<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E26D5C" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1612" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- iOS standalone web-app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vyact" />

    <meta name="description" content="The money app your whole household shares: budgets, bills, splits, debt payoff, cash flow and net worth in one place, with Pip to answer “can we afford it?”." />
    <meta property="og:site_name" content="Vyact" />
    <meta property="og:title" content="Vyact — Family budget app" />
    <meta property="og:description" content="The money app your whole household shares." />
    <meta property="og:image" content="https://vyact.app/og-vyact.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vyact — Family budget app" />
    <meta name="twitter:description" content="The money app your whole household shares." />
    <meta name="twitter:image" content="https://vyact.app/og-vyact.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Organization","@id":"https://vyact.app/#organization","name":"Vyact","alternateName":["Vyact app"],"url":"https://vyact.app","logo":"https://vyact.app/og-vyact.png","description":"The family budget app a household runs together — shared budgets, bills, splits, debt payoff, cash flow and net worth, with a free library of plain-English money lessons.","disambiguatingDescription":"Vyact (vyact.app) is a family budget app for couples and households. It is not related to the open-source AI workspace of the same name.","sameAs":["https://www.youtube.com/channel/UCMYdD2TEFJaCSJnsSBs8T7A","https://www.youtube.com/@askvyact"]}
    </script>
    <title>Vyact — Family budget app</title>

    <!-- Analytics: Google tag (GA4). Since v10.125.0 (T4b, audit XC-PRV-03; owner, 19 Oct 2026) it is ASKED FOR
         first on the web (a banner; Settings and the Cookie Policy change the choice) and on in the Android
         app (its own permissions). Only on vyact.app, never before consent, loaded after paint + idle, with
         a redacted page_location. The build puts the script from api/_consent.js here (vite.config.ts,
         `vyact-analytics`), the same one the public Learn pages carry. -->
    <!--vyact:analytics-->

    <!-- Fonts (v10.52.0): fetched without blocking the first paint. The stylesheet used to be
         render-blocking (~780 ms on a throttled phone). Text now paints at once in the system
         fallback and swaps when the fonts arrive (they already used display=swap). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>

    <!-- ANDROID-OVERLAY — preset the saved theme before first paint so the boot loader below
         (and the first app frame) matches the app: dark "Nocturne" by default, light ("warm")
         when chosen, OS-following for "system". Same rule as setTheme() (store/slices/syncSlice). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vt_theme') || 'dark';
          var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.dataset.theme = d ? 'dark' : 'warm';
          r.classList.toggle('dark', d);
        } catch (e) { /* storage blocked — the app falls back to dark */ }
      })();
    </script>
    <!-- ANDROID-OVERLAY — instant branded loader styles (Aurora palette). -->
    <style>
      html,body{background:#0F181B}
      html[data-theme="warm"],html[data-theme="warm"] body{background:#E7EDEC}
      #vyact-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0F181B;z-index:9999}
      html[data-theme="warm"] #vyact-boot{background:#E7EDEC}
      .vyact-boot__pip{animation:vyactBreathe 1.6s ease-in-out infinite;transform-origin:center}
      .vyact-boot__word{font-family:Outfit,system-ui,sans-serif;font-weight:700;font-size:28px;letter-spacing:-.01em;color:#E9F1F0}
      html[data-theme="warm"] .vyact-boot__word{color:#12201F}
      .vyact-boot__sub{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#7F9694}
      @keyframes vyactBreathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.07);opacity:1}}
      @media (prefers-reduced-motion:reduce){.vyact-boot__pip{animation:none}}
    </style>
  </head>
  <body>
    <!-- ANDROID-OVERLAY — instant branded loader: shows the pip before React mounts, so there is no
         flash between the native splash and the app. It is a SIBLING of #root, not a child:
         scripts/landingHtml.mjs (the postbuild landing prerender) requires <div id="root"></div> to
         be EMPTY and fails the build otherwise. src/main.tsx removes it on React's first commit. -->
    <div id="vyact-boot" aria-hidden="true">
      <svg class="vyact-boot__pip" width="88" height="88" viewBox="-3 -4 42 43" xmlns="http://www.w3.org/2000/svg">
        <defs><radialGradient id="pipBoot" cx="50%" cy="38%" r="62%"><stop offset="0%" stop-color="#F4B6A8"/><stop offset="100%" stop-color="#E26D5C"/></radialGradient></defs>
        <path d="M18 3 C 27 3, 33 9, 33 18 C 33 27, 27 33, 18 33 C 9 33, 3 27, 3 18 C 3 9, 9 3, 18 3 Z" fill="url(#pipBoot)" stroke="#2A2522" stroke-width="1.2"/>
        <path d="M18 3 Q 16 -1, 14 1 Q 17 3, 18 3 Z" fill="#85A88A" stroke="#2A2522" stroke-width="0.8"/>
        <ellipse cx="13" cy="16" rx="1.4" ry="1.8" fill="#2A2522"/>
        <ellipse cx="23" cy="16" rx="1.4" ry="1.8" fill="#2A2522"/>
        <circle cx="9.5" cy="20" r="1.6" fill="#F4B6A8" opacity="0.8"/>
        <circle cx="26.5" cy="20" r="1.6" fill="#F4B6A8" opacity="0.8"/>
        <path d="M14 22 Q 18 25, 22 22" stroke="#2A2522" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="vyact-boot__word">Vyact</div>
      <div class="vyact-boot__sub">Family budget app</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
